# Application
spring.application.name=School-LMS
server.port=8080

# =====================
# MySQL DataSource
# =====================
spring.datasource.url=jdbc:mysql://localhost:3306/school_lms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# =====================
# JWT Configuration
# =====================
app.jwt.secret=SchoolLMSSecretKey2024VeryLongSecretKeyForJWT256Bits
app.jwt.expiration-ms=86400000

# =====================
# CORS
# =====================
app.cors.allowed-origins=http://localhost:3000

# =====================
# Logging
# =====================
logging.level.com.lms=DEBUG
logging.level.org.springframework.security=INFO
